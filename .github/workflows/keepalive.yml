name: Supabase keepalive

# Free Supabase projects pause after 7 days without activity.
# One small REST query every 3 days keeps the project awake.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database through the REST API
        run: |
          set -a; . ./.env; set +a
          curl -fsS -o /dev/null "$VITE_SUPABASE_URL/rest/v1/profiles?select=user_id&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY"
