name: Study reminders

# Calls the send-reminders function hourly (docs/reminders.md). Vercel's free cron runs only daily.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ vars.APP_URL }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$REMINDER_CRON_SECRET" ]; then
            echo "APP_URL or REMINDER_CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST -H "x-cron-secret: $REMINDER_CRON_SECRET" "$APP_URL/api/send-reminders"
